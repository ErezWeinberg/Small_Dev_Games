<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Simon</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <div class="score-board">
            <div>Level: <span id="level">0</span></div>
            <div>Best: <span id="best">0</span></div>
        </div>

        <div class="status" id="status">Press START to play</div>

        <div class="simon">
            <div class="pad green" data-color="0"></div>
            <div class="pad red" data-color="1"></div>
            <div class="pad yellow" data-color="2"></div>
            <div class="pad blue" data-color="3"></div>
            <button id="startBtn" class="center-btn">START</button>
        </div>

        <div class="controls-hint">Click the pads or use keys <strong>Q W A S</strong></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
