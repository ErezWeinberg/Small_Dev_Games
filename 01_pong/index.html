<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Pong</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <div class="score-board">
            <span id="player-score">0</span>
            <span id="ai-score">0</span>
        </div>
        <canvas id="pong-canvas" width="800" height="500"></canvas>
        <div class="controls-hint">Use <strong>W</strong> and <strong>S</strong> or <strong>Up/Down Arrows</strong> to move</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
