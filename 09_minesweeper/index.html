<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Minesweeper</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <div class="score-board">
            <div>💣 Mines: <span id="mines-left">10</span></div>
            <div>⏱️ Time: <span id="timer">0</span>s</div>
        </div>

        <div class="status" id="status">Left-click to reveal, Right-click to flag 🚩</div>

        <div class="board" id="board"></div>

        <button id="restartBtn">New Game</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
